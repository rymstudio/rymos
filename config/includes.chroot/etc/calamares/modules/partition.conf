# RymOS: /boot separato e non cifrato, swap su file
---
userSwapChoices:
    - none
    - file
initialSwapChoice: file
luksGeneration: luks2
partitionLayout:
    - name: "boot"
      filesystem: "ext4"
      noEncrypt: true
      mountPoint: "/boot"
      size: 1G
    - name: "root"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%
